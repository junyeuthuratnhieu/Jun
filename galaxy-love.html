<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>💫</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  :root {
    --void: #04010c;
    --void-2: #0c0420;
    --deep-magenta: #3a0a3f;
    --pink: #ff6fa8;
    --pink-hi: #ffd6e6;
    --gold: #ffd98e;
    --ink: #ffe9f2;
    --ink-soft: rgba(255,233,242,0.68);
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    box-sizing: border-box;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--void);
    overflow: hidden;
    font-family: 'Quicksand', sans-serif;
    color: var(--ink);
    -webkit-tap-highlight-color: transparent;
  }

  #webgl {
    position: fixed;
    inset: 0;
    display: block;
    touch-action: none;
  }

  #flash {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(circle at 50% 55%, #fff 0%, var(--pink-hi) 18%, transparent 65%);
    opacity: 0;
    z-index: 30;
  }
  #flash.active { animation: flash-pop 0.9s ease-out forwards; }
  @keyframes flash-pop {
    0% { opacity: 0; }
    18% { opacity: 0.9; }
    100% { opacity: 0; }
  }

  /* ---------- Intro ---------- */
  #intro {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 40px 28px;
    text-align: center;
    background:
      radial-gradient(ellipse 70% 50% at 50% 30%, rgba(255,111,168,0.14), transparent 60%),
      linear-gradient(180deg, var(--void) 0%, var(--void-2) 60%, var(--deep-magenta) 130%);
    transition: opacity 1s ease, transform 1.1s ease;
  }
  #intro.leaving {
    opacity: 0;
    transform: scale(1.12);
    pointer-events: none;
  }
  .eyebrow-heart {
    font-size: 1.6rem;
    filter: drop-shadow(0 0 10px rgba(255,111,168,0.85));
    animation: pulse-soft 1.8s ease-in-out infinite;
  }
  @keyframes pulse-soft {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.18); }
  }
  #intro h1 {
    font-family: 'Quicksand', sans-serif;
    font-style: normal;
    font-weight: 700;
    font-size: clamp(1.7rem, 8vw, 2.5rem);
    line-height: 1.28;
    margin: 0;
    max-width: 15ch;
    background: linear-gradient(180deg, #fff 0%, var(--pink-hi) 55%, var(--pink) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 0 26px rgba(255,111,168,0.35);
  }
  #intro p {
    margin: 0;
    max-width: 30ch;
    font-size: 0.95rem;
    color: var(--ink-soft);
    line-height: 1.6;
  }
  #enterBtn {
    margin-top: 10px;
    border: none;
    cursor: pointer;
    padding: 15px 34px;
    border-radius: 999px;
    font-family: 'Quicksand', sans-serif;
    font-weight: 700;
    font-size: 0.92rem;
    letter-spacing: 0.04em;
    color: #3a0a24;
    background: linear-gradient(135deg, var(--gold), var(--pink-hi) 55%, var(--pink));
    box-shadow: 0 10px 24px rgba(255,111,168,0.4), 0 2px 0 rgba(255,255,255,0.5) inset;
    transition: transform 0.25s ease, box-shadow 0.25s ease;
  }
  #enterBtn:active { transform: scale(0.96); }

  /* ---------- HUD in galaxy scene ---------- */
  #hud {
    position: fixed;
    inset: 0;
    z-index: 10;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    padding: calc(22px + env(safe-area-inset-top, 0px)) 20px calc(30px + env(safe-area-inset-bottom, 0px));
    opacity: 0;
    transition: opacity 1s ease 0.6s;
  }
  #hud.show { opacity: 1; }
  .drag-hint {
    font-size: 0.78rem;
    color: var(--ink-soft);
    letter-spacing: 0.03em;
    opacity: 0.85;
    animation: fade-hint 5s ease forwards;
  }
  @keyframes fade-hint {
    0%, 55% { opacity: 0.85; }
    100% { opacity: 0; }
  }
  #openLetterBtn {
    pointer-events: auto;
    border: 1px solid rgba(255,214,230,0.55);
    background: rgba(30, 8, 28, 0.45);
    backdrop-filter: blur(6px);
    color: var(--ink);
    font-family: 'Quicksand', sans-serif;
    font-weight: 600;
    font-size: 0.88rem;
    letter-spacing: 0.03em;
    padding: 13px 24px;
    border-radius: 999px;
    display: flex;
    align-items: center;
    gap: 8px;
    box-shadow: 0 8px 20px rgba(255,111,168,0.22);
    animation: bob 3s ease-in-out infinite;
  }
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-5px); }
  }

  /* ---------- Finale card ---------- */
  #finale {
    position: fixed;
    inset: 0;
    z-index: 25;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 28px;
    background: rgba(4, 1, 12, 0.72);
    backdrop-filter: blur(3px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.5s ease;
  }
  #finale.show { opacity: 1; pointer-events: auto; }
  .card {
    position: relative;
    width: min(86vw, 360px);
    padding: 38px 26px 30px;
    border-radius: 22px;
    text-align: center;
    background: linear-gradient(165deg, #2a0d2e 0%, #170621 70%);
    border: 1px solid rgba(255,214,230,0.18);
    box-shadow: 0 30px 60px rgba(0,0,0,0.55), 0 0 40px rgba(255,111,168,0.12);
    transform: translateY(14px) scale(0.97);
    transition: transform 0.5s cubic-bezier(.2,.8,.25,1);
  }
  #finale.show .card { transform: translateY(0) scale(1); }
  .card .glyph {
    font-size: 1.9rem;
    filter: drop-shadow(0 0 12px rgba(255,111,168,0.7));
  }
  .card h2 {
    font-family: 'Quicksand', sans-serif;
    font-style: normal;
    font-weight: 700;
    font-size: 1.5rem;
    margin: 10px 0 14px;
    color: var(--pink-hi);
  }
  .card p {
    font-size: 0.92rem;
    line-height: 1.75;
    color: rgba(255,238,246,0.85);
    margin: 0 0 8px;
  }
  .card .signature {
    margin-top: 16px;
    font-family: 'Quicksand', sans-serif;
    font-style: normal;
    font-weight: 600;
    font-size: 1.05rem;
    color: var(--gold);
  }
  .closeBtn {
    margin-top: 22px;
    border: none;
    background: transparent;
    color: var(--ink-soft);
    font-family: 'Quicksand', sans-serif;
    font-size: 0.82rem;
    letter-spacing: 0.05em;
    padding: 10px 18px;
    border: 1px solid rgba(255,214,230,0.3);
    border-radius: 999px;
    cursor: pointer;
  }

  @media (prefers-reduced-motion: reduce) {
    .eyebrow-heart, #openLetterBtn, .drag-hint { animation: none; }
  }
</style>
</head>
<body>

<canvas id="webgl"></canvas>
<div id="flash"></div>

<div id="intro">
  <div class="eyebrow-heart">💗</div>
  <h1>Một thiên hà tình yêu<br>dành cho em</h1>
  <p>Nơi mỗi vì sao là một điều anh muốn nói với em.</p>
  <button id="enterBtn">Bước vào thiên hà</button>
</div>

<div id="hud">
  <div class="drag-hint">chạm và kéo để xoay thiên hà</div>
  <button id="openLetterBtn"><span>💌</span><span>Chạm để đọc lời nhắn</span></button>
</div>

<div id="finale">
  <div class="card">
    <div class="glyph">✨💗✨</div>
    <h2>Dành cho thư</h2>
    <p>quân yêu thư rất nhìu vì vậy đừng bỏ lại quân nhá&nbsp;:)</p>
    <div class="signature">— Jun</div>
    <button class="closeBtn" id="closeFinale">Đóng lại</button>
  </div>
</div>

<script>
(function () {
  const canvas = document.getElementById('webgl');
  const intro = document.getElementById('intro');
  const enterBtn = document.getElementById('enterBtn');
  const flash = document.getElementById('flash');
  const hud = document.getElementById('hud');
  const openLetterBtn = document.getElementById('openLetterBtn');
  const finale = document.getElementById('finale');
  const closeFinale = document.getElementById('closeFinale');

  let renderer, scene, camera, clock;
  let galaxyGroup, heartGroup, labelsGroup, starsMesh;
  let entered = false;

  const state = {
    theta: Math.PI * 0.22,
    phi: 1.15,
    radius: 10.5,
    minRadius: 4,
    maxRadius: 24,
    targetTheta: Math.PI * 0.22,
    autoRotate: true,
    dragging: false,
    pinching: false,
    pinchStartDist: 0,
    pinchStartRadius: 10.5,
    lastX: 0,
    lastY: 0
  };

  function initRenderer() {
    renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x04010c, 1);

    scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x04010c, 0.028);

    camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 200);
    updateCameraFromSpherical();

    clock = new THREE.Clock();
  }

  function updateCameraFromSpherical() {
    const x = state.radius * Math.sin(state.phi) * Math.sin(state.theta);
    const y = state.radius * Math.cos(state.phi) + 1.1;
    const z = state.radius * Math.sin(state.phi) * Math.cos(state.theta);
    camera.position.set(x, y, z);
    camera.lookAt(0, 1.4, 0);
  }

  function makeStarfield() {
    const count = 2600;
    const positions = new Float32Array(count * 3);
    const colors = new Float32Array(count * 3);
    const palette = [
      new THREE.Color('#ffffff'),
      new THREE.Color('#ffd6e6'),
      new THREE.Color('#ffe6b8')
    ];
    for (let i = 0; i < count; i++) {
      const r = 30 + Math.random() * 55;
      const t = Math.random() * Math.PI * 2;
      const p = Math.acos((Math.random() * 2) - 1);
      positions[i * 3] = r * Math.sin(p) * Math.cos(t);
      positions[i * 3 + 1] = r * Math.cos(p) * 0.6;
      positions[i * 3 + 2] = r * Math.sin(p) * Math.sin(t);
      const c = palette[Math.floor(Math.random() * palette.length)];
      colors[i * 3] = c.r; colors[i * 3 + 1] = c.g; colors[i * 3 + 2] = c.b;
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    const mat = new THREE.PointsMaterial({
      size: 0.09, sizeAttenuation: true, vertexColors: true,
      transparent: true, opacity: 0.85, depthWrite: false
    });
    starsMesh = new THREE.Points(geo, mat);
    scene.add(starsMesh);
  }

  function makeGalaxy() {
    const count = 9000;
    const radius = 9.5;
    const branches = 5;
    const spin = 1.1;
    const randomness = 0.42;
    const randomnessPower = 3;
    const insideColor = new THREE.Color('#ffe9d6');
    const outsideColor = new THREE.Color('#8a1a6b');

    const positions = new Float32Array(count * 3);
    const colors = new Float32Array(count * 3);

    for (let i = 0; i < count; i++) {
      const i3 = i * 3;
      const r = Math.pow(Math.random(), 1.5) * radius;
      const branchAngle = ((i % branches) / branches) * Math.PI * 2;
      const spinAngle = r * spin;

      const randX = Math.pow(Math.random(), randomnessPower) * (Math.random() < 0.5 ? 1 : -1) * randomness * r;
      const randY = Math.pow(Math.random(), randomnessPower) * (Math.random() < 0.5 ? 1 : -1) * randomness * 0.3;
      const randZ = Math.pow(Math.random(), randomnessPower) * (Math.random() < 0.5 ? 1 : -1) * randomness * r;

      positions[i3] = Math.cos(branchAngle + spinAngle) * r + randX;
      positions[i3 + 1] = randY;
      positions[i3 + 2] = Math.sin(branchAngle + spinAngle) * r + randZ;

      const mixed = insideColor.clone().lerp(outsideColor, r / radius);
      colors[i3] = mixed.r; colors[i3 + 1] = mixed.g; colors[i3 + 2] = mixed.b;
    }

    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    const mat = new THREE.PointsMaterial({
      size: 0.075, sizeAttenuation: true, depthWrite: false,
      blending: THREE.AdditiveBlending, vertexColors: true, transparent: true, opacity: 0.95
    });

    galaxyGroup = new THREE.Group();
    galaxyGroup.add(new THREE.Points(geo, mat));
    scene.add(galaxyGroup);
  }

  function heartXY(t) {
    const x = 16 * Math.pow(Math.sin(t), 3);
    const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
    return [x / 16, y / 16];
  }

  function makeHeart() {
    const count = 3600;
    const positions = new Float32Array(count * 3);
    const colors = new Float32Array(count * 3);
    const core = new THREE.Color('#fff3e0');
    const mid = new THREE.Color('#ff9dc0');
    const edge = new THREE.Color('#ff2e7a');

    for (let i = 0; i < count; i++) {
      const t = Math.random() * Math.PI * 2;
      const [hx, hy] = heartXY(t);
      const fill = Math.sqrt(Math.random());
      const jitterT = (Math.random() - 0.5) * 0.06;
      const [jx, jy] = heartXY(t + jitterT);
      const x = jx * fill;
      const y = jy * fill;
      const z = (Math.random() - 0.5) * 0.55 * (1 - fill * 0.5);

      const scale = 2.15;
      const i3 = i * 3;
      positions[i3] = x * scale;
      positions[i3 + 1] = y * scale;
      positions[i3 + 2] = z * scale;

      const c = fill < 0.45 ? core.clone().lerp(mid, fill / 0.45) : mid.clone().lerp(edge, (fill - 0.45) / 0.55);
      colors[i3] = c.r; colors[i3 + 1] = c.g; colors[i3 + 2] = c.b;
    }

    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    const mat = new THREE.PointsMaterial({
      size: 0.065, sizeAttenuation: true, depthWrite: false,
      blending: THREE.AdditiveBlending, vertexColors: true, transparent: true, opacity: 1
    });

    heartGroup = new THREE.Group();
    const points = new THREE.Points(geo, mat);
    heartGroup.add(points);
    heartGroup.position.set(0, 3.4, 0);
    heartGroup.scale.setScalar(1.35);
    scene.add(heartGroup);
  }

  function makeTextSprite(text, opts) {
    opts = opts || {};
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const fontSize = (opts.fontSize || 44);
    const font = opts.emoji ? (fontSize + "px sans-serif") : ("600 " + fontSize + "px 'Quicksand', sans-serif");
    const off = document.createElement('canvas');
    const ctx = off.getContext('2d');
    ctx.font = font;
    const metrics = ctx.measureText(text);
    const padX = fontSize * 0.9;
    const padY = fontSize * 0.75;
    const w = Math.ceil(metrics.width + padX * 2);
    const h = Math.ceil(fontSize * 1.5 + padY);
    off.width = w * dpr;
    off.height = h * dpr;
    ctx.scale(dpr, dpr);
    ctx.font = font;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    if (!opts.emoji) {
      ctx.shadowColor = opts.glow || 'rgba(255,120,180,0.9)';
      ctx.shadowBlur = fontSize * 0.5;
      ctx.fillStyle = opts.color || '#ffe6f0';
      ctx.fillText(text, w / 2, h / 2);
      ctx.shadowBlur = 0;
      ctx.fillStyle = opts.color || '#ffe6f0';
      ctx.fillText(text, w / 2, h / 2);
    } else {
      ctx.fillText(text, w / 2, h / 2);
    }
    const tex = new THREE.CanvasTexture(off);
    tex.needsUpdate = true;
    const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false });
    const sprite = new THREE.Sprite(mat);
    const aspect = w / h;
    const baseHeight = opts.scale || 0.9;
    sprite.scale.set(baseHeight * aspect, baseHeight, 1);
    return sprite;
  }

  function makeLabels() {
    labelsGroup = new THREE.Group();
    const messages = [
      'Mãi yêu thư', 'Yêu em', 'Mãi yêu thư',
      'Yêu em', 'Mãi yêu thư', 'Yêu em'
    ];
    const ringRadius = 6.4;
    messages.forEach((msg, i) => {
      const angle = (i / messages.length) * Math.PI * 2 + Math.random() * 0.25;
      const r = ringRadius + (Math.random() - 0.5) * 1.6;
      const y = 0.4 + Math.random() * 3.2;
      const sprite = makeTextSprite(msg, { scale: 0.72, color: '#ffe6f0', glow: 'rgba(255,111,168,0.95)' });
      sprite.position.set(Math.cos(angle) * r, y, Math.sin(angle) * r);
      sprite.userData = { angle, r, y, speed: 0.05 + Math.random() * 0.04, bobOffset: Math.random() * Math.PI * 2 };
      labelsGroup.add(sprite);
    });

    const glyphs = ['💫', '🎀', '💝', '✨', '🕊️', '💐'];
    glyphs.forEach((g, i) => {
      const angle = (i / glyphs.length) * Math.PI * 2 + 0.4;
      const r = 4.4 + Math.random() * 2.2;
      const y = 0.6 + Math.random() * 3.6;
      const sprite = makeTextSprite(g, { emoji: true, scale: 0.62, fontSize: 56 });
      sprite.position.set(Math.cos(angle) * r, y, Math.sin(angle) * r);
      sprite.userData = { angle, r, y, speed: 0.07 + Math.random() * 0.05, bobOffset: Math.random() * Math.PI * 2 };
      labelsGroup.add(sprite);
    });

    scene.add(labelsGroup);
  }

  function buildScene() {
    initRenderer();
    makeStarfield();
    makeGalaxy();
    makeHeart();
    makeLabels();
    window.addEventListener('resize', onResize);
    animate();
  }

  function onResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  }

  function animate() {
    requestAnimationFrame(animate);
    const t = clock.getElapsedTime();
    const dt = clock.getDelta();

    if (galaxyGroup) galaxyGroup.rotation.y += dt * 0.045;
    if (heartGroup) {
      heartGroup.rotation.y += dt * 0.18;
      heartGroup.position.y = 3.4 + Math.sin(t * 0.9) * 0.18;
    }
    if (labelsGroup) {
      labelsGroup.children.forEach((s) => {
        const u = s.userData;
        u.angle += dt * u.speed * 0.5;
        s.position.x = Math.cos(u.angle) * u.r;
        s.position.z = Math.sin(u.angle) * u.r;
        s.position.y = u.y + Math.sin(t * 0.6 + u.bobOffset) * 0.22;
      });
    }
    if (starsMesh) starsMesh.rotation.y += dt * 0.004;

    if (state.autoRotate && !state.dragging) {
      state.theta += dt * 0.05;
    }
    updateCameraFromSpherical();

    renderer.render(scene, camera);
  }

  // ---- drag to orbit ----
  function clamp(v, lo, hi) { return Math.min(hi, Math.max(lo, v)); }

  function touchDistance(touches) {
    const dx = touches[0].clientX - touches[1].clientX;
    const dy = touches[0].clientY - touches[1].clientY;
    return Math.sqrt(dx * dx + dy * dy);
  }

  function onPointerDown(e) {
    if (e.touches && e.touches.length === 2) {
      state.pinching = true;
      state.dragging = false;
      state.autoRotate = false;
      state.pinchStartDist = touchDistance(e.touches);
      state.pinchStartRadius = state.radius;
      return;
    }
    state.dragging = true;
    state.autoRotate = false;
    const p = e.touches ? e.touches[0] : e;
    state.lastX = p.clientX; state.lastY = p.clientY;
  }
  function onPointerMove(e) {
    if (e.touches && e.touches.length === 2) {
      state.pinching = true;
      const dist = touchDistance(e.touches);
      const scale = state.pinchStartDist / Math.max(dist, 1);
      state.radius = clamp(state.pinchStartRadius * scale, state.minRadius, state.maxRadius);
      return;
    }
    if (!state.dragging || state.pinching) return;
    const p = e.touches ? e.touches[0] : e;
    const dx = p.clientX - state.lastX;
    const dy = p.clientY - state.lastY;
    state.lastX = p.clientX; state.lastY = p.clientY;
    state.theta -= dx * 0.005;
    state.phi = Math.min(1.5, Math.max(0.7, state.phi - dy * 0.004));
  }
  function onPointerUp(e) {
    if (e && e.touches && e.touches.length > 0) {
      // one finger still down after a pinch: restart drag reference from it
      state.pinching = false;
      const p = e.touches[0];
      state.dragging = true;
      state.lastX = p.clientX; state.lastY = p.clientY;
      return;
    }
    state.dragging = false;
    state.pinching = false;
    setTimeout(() => { state.autoRotate = true; }, 1800);
  }
  function onWheel(e) {
    e.preventDefault();
    state.autoRotate = false;
    state.radius = clamp(state.radius + e.deltaY * 0.012, state.minRadius, state.maxRadius);
    clearTimeout(onWheel._t);
    onWheel._t = setTimeout(() => { state.autoRotate = true; }, 1800);
  }

  canvas.addEventListener('mousedown', onPointerDown);
  window.addEventListener('mousemove', onPointerMove);
  window.addEventListener('mouseup', onPointerUp);
  canvas.addEventListener('touchstart', onPointerDown, { passive: true });
  canvas.addEventListener('touchmove', onPointerMove, { passive: true });
  canvas.addEventListener('touchend', onPointerUp, { passive: true });
  canvas.addEventListener('touchcancel', onPointerUp, { passive: true });
  canvas.addEventListener('wheel', onWheel, { passive: false });

  // ---- flow ----
  function enterGalaxy() {
    if (entered) return;
    entered = true;
    flash.classList.add('active');
    intro.classList.add('leaving');
    setTimeout(() => { intro.style.display = 'none'; }, 1100);
    setTimeout(() => { hud.classList.add('show'); }, 500);

    // quick dolly-in for a "flying into the galaxy" feel
    const startRadius = 26, endRadius = 10.5;
    const dur = 1500;
    const t0 = performance.now();
    function dolly(now) {
      const p = Math.min(1, (now - t0) / dur);
      const eased = 1 - Math.pow(1 - p, 3);
      state.radius = startRadius + (endRadius - startRadius) * eased;
      if (p < 1) requestAnimationFrame(dolly);
    }
    state.radius = startRadius;
    requestAnimationFrame(dolly);
  }

  enterBtn.addEventListener('click', enterGalaxy);
  openLetterBtn.addEventListener('click', () => finale.classList.add('show'));
  closeFinale.addEventListener('click', () => finale.classList.remove('show'));

  function start() {
    buildScene();
  }

  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(start).catch(start);
    setTimeout(start, 900); // fallback in case fonts.ready hangs
  } else {
    start();
  }
  // guard against double-init if both fonts.ready and timeout fire
  let started = false;
  const _origBuild = buildScene;
  buildScene = function () {
    if (started) return;
    started = true;
    _origBuild();
  };
})();
</script>
</body>
</html>
